<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meczownik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Meczownik</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: aplikacja jednoekranowa — ekran główny z listą meczów kolejki; po wejściu w mecz tablica wyników u góry, treść zakładek, dolny pasek nawigacji */
:root{
  --bg:#eef1ec; --surface:#ffffff; --line:#d5dcd3; --fg:#14201a; --muted:#5d6b62;
  --pitch:#1d5a3a; --pitch-ink:#f3f7f2; --accent:#c9771a; --home:#1d5a3a; --away:#b4452f;
  --yellow:#e2b31c; --red:#c8322a; --var:#3d63b8;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1410; --surface:#142019; --line:#24352b; --fg:#e7eee8; --muted:#8fa196;
  --pitch:#174a30; --pitch-ink:#f3f7f2; --accent:#e8963a; --home:#4fb07c; --away:#e0705a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1410; --surface:#142019; --line:#24352b; --fg:#e7eee8; --muted:#8fa196;
  --pitch:#174a30; --pitch-ink:#f3f7f2; --accent:#e8963a; --home:#4fb07c; --away:#e0705a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;width:100%;box-sizing:border-box}

/* Nagłówki (ekran główny i tablica wyników) */
.board{background:var(--pitch);color:var(--pitch-ink);flex:none;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,255,255,.035) 48px 96px);pointer-events:none}
.board .wrap{padding-block:12px 14px;position:relative;z-index:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.meta > span{opacity:.85}
.back{background:var(--pitch-ink);border:0;color:var(--pitch);font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:7px 14px 7px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
nav button.home{color:var(--fg)}
nav button.home svg{stroke-width:2}
.sample{font-family:var(--f-data);font-size:10px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.35);padding:2px 6px;border-radius:3px;opacity:.85}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.7);color:#fff;flex:none}
.team b{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.nums{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.nums.ko{font-size:40px;opacity:.9}
.status{display:flex;justify-content:center;gap:6px;margin-top:4px}
.chip{font-family:var(--f-data);font-size:11px;padding:3px 7px;border-radius:3px;background:rgba(255,255,255,.14)}
.chip.live{background:var(--accent);color:#1b1206;font-weight:600}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:12px;opacity:.9}
.scorers div:last-child{text-align:right}
.apptitle{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:10px 0 2px}
.appsub{font-size:13px;opacity:.8}
.rounds{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:14px;background:rgba(0,0,0,.18);border-radius:8px}
.rounds button{background:none;border:0;color:var(--pitch-ink);font-size:22px;height:40px;cursor:pointer;border-radius:8px}
.rounds button:disabled{opacity:.25;cursor:default}
.rounds div{text-align:center;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.rounds small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none;opacity:.75}

/* Treść */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv div{padding:9px 12px;border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{text-align:right;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* Ligi */
.leagues{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.leagues::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.leagues button{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--pitch-ink);font:700 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.leagues button small{font:500 10px var(--f-body);letter-spacing:0;text-transform:none;opacity:.75}
.leagues button[aria-pressed="true"]{background:var(--pitch-ink);color:var(--pitch);border-color:var(--pitch-ink)}

/* Lista meczów */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters .cnt{font-family:var(--f-data);font-size:11px;background:var(--accent);color:#1b1206;border-radius:999px;padding:0 6px}
.match{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:12px;border:0;border-top:1px solid var(--line);background:none;width:100%;color:inherit;font:inherit;text-align:left;cursor:pointer}
.match:first-child{border-top:0}
.match:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.when{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-data);font-size:12px;color:var(--muted);border-right:1px solid var(--line);padding-right:10px}
.when b{font-family:var(--f-display);font-size:18px;color:var(--fg);font-weight:700}
.when.live b{color:var(--accent)}
.when.live small{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.sides{display:flex;flex-direction:column;gap:6px;min-width:0}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side .c{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.win span{font-weight:600}
.side.lose span{color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:20px;text-align:right;font-variant-numeric:tabular-nums;min-width:18px}
.goals.live{color:var(--accent)}
.goals .rc{margin-right:4px;vertical-align:2px}
.day{display:flex;justify-content:space-between;align-items:baseline}
.day small{color:var(--muted);font-size:12px}

/* Sędziowie */
.ref{display:flex;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.ref:first-child{border-top:0}
.role{font-family:var(--f-data);font-size:10px;width:44px;flex:none;text-align:center;padding:4px 0;border-radius:4px;background:var(--bg);color:var(--muted);font-weight:600}
.role.main{background:var(--fg);color:var(--bg)}
.role.var{background:var(--var);color:#fff}
.ref .who{flex:1;min-width:0}
.ref .who b{display:block}
.ref .who small{color:var(--muted)}
.flag{font-size:12px;color:var(--accent);font-weight:600}
.note{display:flex;align-items:baseline;justify-content:space-between;padding:12px;gap:12px}
.note b{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--accent)}

/* Przełącznik */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--pitch-ink)}

/* Składy */
.pl{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.pl:first-child{border-top:0}
.shirt{font-family:var(--f-display);font-weight:700;font-size:18px;width:28px;text-align:center;color:var(--home)}
.away .shirt{color:var(--away)}
.pl .nm{flex:1;min-width:0}
.pos{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.icons{display:flex;gap:4px;align-items:center;font-size:12px}
.yc,.rc{width:9px;height:12px;border-radius:2px;display:inline-block}
.yc{background:var(--yellow)}.rc{background:var(--red)}
.sub{color:var(--muted);font-family:var(--f-data);font-size:11px}
.inj{color:var(--red);font-size:11px;font-weight:600}

/* Ustawienie na boisku */
.field{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:68/105;background:var(--pitch);border-radius:10px;overflow:hidden}
.field::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 10%,rgba(255,255,255,.04) 10% 20%)}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.man{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--pitch-ink);width:76px}
.man .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative;color:#fff}
.man .no.gk{background:var(--accent)!important;color:#1b1206}
.man .lbl{font:600 11px/1.15 var(--f-body);text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.man .badge{position:absolute;top:-5px;right:-8px;display:flex;gap:2px}
.man .badge .yc,.man .badge .rc{width:8px;height:11px;border:1px solid rgba(0,0,0,.3)}
.man .in{font-family:var(--f-data);font-size:9px;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:3px}
.man.off{opacity:.45}
.formation{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
.formation b{font-family:var(--f-display);font-size:22px;font-weight:700}
.formation span{font-size:12px;color:var(--muted);text-align:right}

/* Oś czasu */
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 12px;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .min{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.ev .min small{display:block;font-family:var(--f-data);font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.ev .tag{font-family:var(--f-data);font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;margin-right:6px;vertical-align:1px}
.t-goal{background:var(--pitch);color:var(--pitch-ink)}
.t-yc{background:var(--yellow);color:#2a2000}
.t-rc{background:var(--red);color:#fff}
.t-var{background:var(--var);color:#fff}
.t-sub{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.t-pen{background:var(--accent);color:#1b1206}
.ev p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ev.h b.side{color:var(--home)} .ev.a b.side{color:var(--away)}
.period{padding:7px 12px;background:var(--bg);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Boisko poziome */
.pitchbox{background:var(--pitch);border-radius:10px;padding:10px}
.pitchbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* Statystyki porównawcze */
.cmp{padding:10px 12px;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}
.cmp .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.cmp .row span:nth-child(2){color:var(--muted);text-align:center}
.cmp .row b{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:600}
.bar{display:flex;gap:3px;height:6px}
.bar i{display:block;border-radius:3px}
.bar i:first-child{background:var(--home)}
.bar i:last-child{background:var(--away)}
.cmp .row b.lead{color:var(--accent)}

/* Zawodnik */
select{width:100%;font:500 15px var(--f-body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.phead{display:flex;gap:12px;align-items:center;padding:12px}
.phead .shirt{font-size:36px;width:auto}
.phead b{font-size:17px}
.rating{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:28px;background:var(--pitch);color:var(--pitch-ink);padding:2px 10px;border-radius:6px}
.speed{padding:12px;display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
.speed .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Szanse */
.prob{padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.prob .lbls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:12px;color:var(--muted)}
.prob .lbls span:nth-child(2){text-align:center}.prob .lbls span:last-child{text-align:right}
.prob .pcts{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline}
.prob .pcts b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.prob .pcts b:nth-child(2){font-size:24px;color:var(--muted);text-align:center}
.prob .pcts b:last-child{text-align:right}
.pbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.pbar i{display:block;height:100%}
.pbar i.d{background:var(--line)}
.prob small{color:var(--muted);font-size:12px}
.heat{display:grid;grid-template-columns:28px repeat(6,1fr);gap:3px;padding:12px;font-family:var(--f-data);font-size:11px}
.heat div{aspect-ratio:1.4;display:grid;place-items:center;border-radius:4px;font-variant-numeric:tabular-nums}
.heat .ax{color:var(--muted);aspect-ratio:auto}
.heat .hit{outline:2px solid var(--accent);outline-offset:-2px;font-weight:600}
.form{display:flex;gap:3px}
.form i{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font:600 10px var(--f-data);font-style:normal;color:#fff}
.form .W{background:#2f8a52}.form .D{background:#8b8f8c}.form .L{background:var(--red)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);align-items:center;font-size:13px}
.vs:first-child{border-top:0}
.vs span:nth-child(2){color:var(--muted);text-align:center;font-size:12px}
.vs b{font-family:var(--f-data);font-weight:600}
.vs b:last-child,.vs .form:last-child{justify-self:end}
.method{font-size:12px;color:var(--muted);line-height:1.5}

/* Typy */
.odds{width:100%;border-collapse:collapse;font-size:13px}
.odds th{font:600 10px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.odds th:first-child,.odds td:first-child{text-align:left}
.odds td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.odds td:first-child{font-family:var(--f-body);white-space:normal}
.odds tr.val td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.odds .pos{color:#2f8a52;font-weight:600}.odds .neg{color:var(--muted)}
.odds .won{color:#2f8a52}.odds .lost{color:var(--red)}
.tableScroll{overflow-x:auto}
.pick{padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.pick .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dec{font:700 13px var(--f-display);letter-spacing:.08em;padding:4px 10px;border-radius:4px}
.dec.bet{background:#2f8a52;color:#fff}.dec.no{background:var(--fg);color:var(--bg)}
.pick .mk{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.pick ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.45}
.pick h3{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 0 0}
.rate{display:flex;gap:3px}.rate i{flex:1;height:6px;border-radius:3px;background:var(--line)}.rate i.on{background:var(--accent)}
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:none;width:100%;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rank:first-child{border-top:0}
.medal{font:800 11px var(--f-display);letter-spacing:.06em;padding:4px 7px;border-radius:4px;color:#1b1206}
.m1{background:#e2b31c}.m2{background:#c3c8c5}.m3{background:#d0915a}
.rank small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rank .ev{font-family:var(--f-data);font-weight:600;color:#2f8a52;text-align:right;font-size:13px}
.rank .ev small{text-align:right}
.resp{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}

/* Dolna nawigacja */
nav{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:1.05fr repeat(7,1fr);padding-block:0;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav button.home{border-right:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9.5px var(--f-body);cursor:pointer;letter-spacing:0;min-width:0}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

/* Panel boczny: folder „Piłka nożna” z ligami */
.drawer{position:fixed;top:0;bottom:0;left:0;width:260px;z-index:30;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 14px) max(10px,env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);transition:transform .2s ease-out}
.drawer.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.35)}
.drawer h3{font:800 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:2px 8px 14px;color:var(--fg)}
.folder{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);font:700 16px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:10px 8px;border-radius:8px;cursor:pointer;text-align:left}
.folder:hover,.lg:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.folder .ball{width:20px;height:20px;flex:none}
.folder .chev{margin-left:auto;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.folder[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lglist{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 18px;padding-left:10px;border-left:1px solid var(--line)}
.lg{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;color:var(--fg);padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;font:700 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.lg small{font:500 11px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.lg[aria-pressed="true"]{background:var(--pitch);color:var(--pitch-ink)}
.lg[aria-pressed="true"] small{color:var(--pitch-ink);opacity:.8}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45)}
.menu{background:none;border:1px solid rgba(255,255,255,.35);color:var(--pitch-ink);border-radius:8px;width:34px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}
.menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.meta .lhs{display:flex;align-items:center;gap:10px;min-width:0}
.meta .lhs > span{opacity:.85}
@media (min-width:900px){
  .drawer{transform:none;box-shadow:none}
  body{padding-left:260px}
  body::before{left:260px}
  .menu,.scrim{display:none!important}
}

  if(state.filter==="all"||state.filter==="ns") html+=picksCard();
  if(!list.length) html+=`<div class="card empty">${isBB()?"Tego dnia nie ma meczów w tej kategorii.<br>Zmień filtr albo przejdź do innego dnia.":"W tej kolejce nie ma meczów w tej kategorii.<br>Zmień filtr albo przejdź do innej kolejki."}</div>`;
  for(const d of [...new Set(list.map(f=>f.date))]){

      const when=f.pst?`<div class="when"><b style="font-size:14px">PRZEŁ.</b><small>${f.time}</small></div>`:f.kind==="live"?`<div class="when live"><b>${m.status.min}</b><small><i class="pulse"></i>LIVE</small></div>`:f.kind==="ft"?`<div class="when"><b>KON.</b><small>${f.time}</small></div>`:`<div class="when"><b>${f.time}</b><small>${dayShort(f.date).split(",")[0]}</small></div>`;
      return `<button class="match" data-mid="${f.id}">${when}
        <div class="sides"><div class="side ${res(gh,ga)}"><i class="c" style="background:${m.home.col}"></i><span>${esc(m.home.name)}</span></div><div class="side ${res(ga,gh)}"><i class="c" style="background:${m.away.col}"></i><span>${esc(m.away.name)}</span></div></div>
        <div class="goals ${f.kind==="live"?"live":""}">${played?`<span>${rcH?'<i class="rc"></i>':""}${gh}</span><span>${rcA?'<i class="rc"></i>':""}${ga}</span>`:`<span style="color:var(--muted)">–</span><span style="color:var(--muted)">–</span>`}</div></button>`}).join("");
    html+=`<section class="panel"><div class="day"><h2>${dayLabel(d)}</h2>${d===TODAY?"<small>dzisiaj</small>":""}</div><div class="card">${rows}</div></section>`;
  }
  if(DATA&&DATA.note) html+=`<div class="legend" style="justify-content:center;text-align:center">${esc(DATA.note)}</div>`;
  $("#view").innerHTML=html;
  $("#nav").hidden=true;
}

const SLOTS=[[50,91],[85,73],[62,77],[38,77],[15,73],[36,58],[64,58],[50,40],[83,36],[17,36],[50,17]];
function slotsFor(f){
  if(!f) return SLOTS;
  const lines=String(f).split("-").map(Number);
  if(lines.some(isNaN)||lines.reduce((a,b)=>a+b,0)!==10) return SLOTS;
  const out=[[50,91]];
  lines.forEach((n,i)=>{const y=lines.length===1?50:77-60*i/(lines.length-1);for(let k=0;k<n;k++)out.push([n===1?50:85-70*k/(n-1),y])});
  return out;
}
function field(s,list,subs){
  const xi=list.filter(p=>p[4]), col=s==="h"?M.home.col:M.away.col;
  const form=(M.formation||{})[s==="h"?"home":"away"], SL=M.real?slotsFor(form):SLOTS;
  const L='stroke="rgba(255,255,255,.55)" stroke-width=".4" fill="none"';
  const lines=`<svg viewBox="0 0 68 105" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="66" height="103" ${L}/><line x1="1" y1="52.5" x2="67" y2="52.5" ${L}/><circle cx="34" cy="52.5" r="9.15" ${L}/><rect x="13.84" y="1" width="40.32" height="16.5" ${L}/><rect x="13.84" y="87.5" width="40.32" height="16.5" ${L}/><rect x="24.84" y="1" width="18.32" height="5.5" ${L}/><rect x="24.84" y="98.5" width="18.32" height="5.5" ${L}/></svg>`;
  const cardsOf=n=>M.events.filter(e=>e.who===n&&(e.t==="yc"||e.t==="rc"));
  let onPitch=11;
  const men=xi.map((p,i)=>{
    let cur=p, inMin=null; const sb=subs.find(e=>e.out===p[1]);
    if(sb){ cur=list.find(q=>q[1]===sb.inn)||["?",sb.inn,p[2]]; inMin=sb.m; }
    const cs=cardsOf(cur[1]), red=cs.some(c=>c.t==="rc"), g=G.filter(e=>e.who===cur[1]).length;
    if(red) onPitch--;
    const sur=cur[1].split(" ").pop(), [x,y]=SL[i]||[50,50];
    const badge=cs.map(c=>`<span class="${c.t==="yc"?"yc":"rc"}"></span>`).join("");
    return `<button class="man ${red?"off":""}" style="left:${x}%;top:${y}%" data-player="${esc(cur[1])}" title="${esc(cur[1])} · ${cur[2]}"><span class="no ${i===0?"gk":""}" style="background:${col}">${cur[0]}<span class="badge">${badge}</span></span><span class="lbl">${esc(sur)}${g?" "+"⚽".repeat(g):""}</span>${inMin?`<span class="in">↑${inMin}' za ${esc(p[1].split(" ").pop())}</span>`:red?`<span class="in">czerwona</span>`:""}</button>`;
  }).join("");
  const when=M.status.kind==="ft"?"koniec meczu":`stan na ${M.status.min}`;
  return `<div class="formation"><b>${esc(M.real?(form||"Ustawienie"):"4-2-3-1")}</b><span>Na boisku: ${onPitch} · ${when}</span></div><div class="field">${lines}${men}</div><div class="legend" style="justify-content:center"><span>Dotknij zawodnika, aby zobaczyć jego statystyki</span></div>`;
}

function indFor(name){
  if(M.ind[name]) return M.ind[name];
  if(M.real) return null;
  const side=M.players.home.some(p=>p[1]===name)?"h":"a", pl=M.players[side==="h"?"home":"away"].find(p=>p[1]===name);
  const r=rng(M.id+name), lim=M.limit;
  const sIn=M.events.find(e=>e.t==="sub"&&e.inn===name), sOut=M.events.find(e=>e.t==="sub"&&e.out===name), red=M.events.find(e=>e.t==="rc"&&e.who===name);
  const st=sIn?sIn.m:0, en=Math.min(sOut?sOut.m:lim, red?red.m:lim), min=Math.max(0,en-st), f=min/90;
  const myG=G.filter(e=>e.who===name), a=M.events.filter(e=>e.t==="goal"&&e.as===name).length;
  const pos=pl[2], att=["N","LS","PS","OP"].includes(pos), def=["ŚO","PO","LO","DP"].includes(pos);
  const pa=Math.round(f*ri(r,15,60));
  const b={team:side,n:pl[0],pos,r:Math.min(10,+(red?4.8+r():6+r()*1.6+myG.length*0.7+a*0.4).toFixed(1)),min,
    km:+(f*(pos==="BR"?5.2:9.5+r()*2)).toFixed(1),spr:Math.round(f*(pos==="BR"?0:att?ri(r,14,26):ri(r,5,16))),
    vmax:+(pos==="BR"?20+r()*3:28+r()*6).toFixed(1),hi:Math.round(f*(pos==="BR"?40:ri(r,250,800))),pas:`${Math.round(pa*(0.72+r()*0.22))}/${pa}`};
  if(pos==="BR"){const conc=G.filter(e=>e.s_!==side).length, sv=Math.round(f*ri(r,0,6)), psxg=+(conc*0.6+sv*0.25+r()*0.3).toFixed(2);
    b.gk={sv,pensv:0,punch:ri(r,0,3),psxg,gp:+(psxg-conc).toFixed(2)};}
  else{const dt=Math.round(f*ri(r,0,att?8:2));
    Object.assign(b,{sh:myG.length+Math.round(f*ri(r,0,att?3:1)),xg:+(myG.reduce((s,e)=>s+e.xg,0)+f*r()*(att?0.4:0.1)).toFixed(2),xa:+(a*0.3+f*r()*0.3).toFixed(2),
      kp:a+Math.round(f*ri(r,0,att?4:1)),dr:`${Math.round(dt*(0.3+r()*0.5))}/${dt}`,tk:Math.round(f*ri(r,0,def?5:2)),int:Math.round(f*ri(r,0,def?5:2)),clr:Math.round(f*ri(r,0,def?8:1)),err:r()<.06?1:0});}
  return M.ind[name]=b;
}
function basicFor(name){
  const side=M.players.home.some(p=>p[1]===name)?"h":"a", pl=M.players[side==="h"?"home":"away"].find(p=>p[1]===name)||["",name,""];
  const sIn=M.events.find(e=>e.t==="sub"&&e.inn===name), sOut=M.events.find(e=>e.t==="sub"&&e.out===name), red=M.events.find(e=>e.t==="rc"&&e.who===name);
  const lim=M.limit||90, min=Math.max(0,Math.min(sOut?sOut.m:lim,red?red.m:lim)-(sIn?sIn.m:0));
  return {basic:true,team:side,n:pl[0],pos:pl[2]||"",min,g:G.filter(e=>e.who===name&&e.t!=="og").length,a:M.events.filter(e=>(e.t==="goal")&&e.as===name).length,cards:M.events.filter(e=>(e.t==="yc"||e.t==="rc")&&e.who===name).length};
}
function playedList(){

const leagueTable=()=>DATA?(DATA.table||[]):(window.__st||(window.__st=sampleTable()));

const MK=[["1","Wygrana gospodarzy"],["X","Remis"],["2","Wygrana gości"],["1X","Podwójna szansa 1X"],["X2","Podwójna szansa X2"],["12","Podwójna szansa 12"],["dnb1","DNB gospodarze"],["dnb2","DNB goście"],["o25","Ponad 2,5 gola"],["u25","Poniżej 2,5 gola"],["bttsY","Obie strzelą – tak"],["bttsN","Obie strzelą – nie"]];

  if(i.h2h&&i.h2h.length) h+=`<section><h2>Bezpośrednie mecze (H2H)</h2><div class="card">${i.h2h.map(x=>`<div class="vs" style="grid-template-columns:1fr"><span style="text-align:left;color:var(--fg)">${esc(x)}</span></div>`).join("")}</div></section>`;
  return h;
}
const RESP='<p class="resp">18+. Typy to analiza statystyczna, nie gwarancja wygranej — nawet ocena 9/10 może przegrać. Graj tylko u legalnych bukmacherów, małymi stawkami. Hazard może uzależniać.</p>';
function picksOfRound(){
  const fx=FIXTURES[state.round]||[], out=[];
  for(const f of fx){ if(f.kind!=="ns"||f.pst) continue; const m=getMatch(f), t=tipOf(m); if(t&&t.decision==="BET") out.push({f,m,t}); }
  if(DATA&&DATA.picks&&DATA.picks.length){ const ord=DATA.picks.map(p=>p.match); return out.filter(x=>ord.includes(x.m.id)).sort((a,b)=>ord.indexOf(a.m.id)-ord.indexOf(b.m.id)).slice(0,3); }
  return out.sort((a,b)=>(b.t.rating-a.t.rating)||((b.t.ev||0)-(a.t.ev||0))).slice(0,3);
}
function picksCard(){
  const fx=FIXTURES[state.round]||[]; if(!fx.some(f=>f.kind==="ns"&&!f.pst)) return "";
  const P=picksOfRound(), names=["TOP PICK","SECOND","THIRD"];
  const body=P.length?P.map((x,i)=>`<button class="rank" data-tip="${x.m.id}"><span class="medal m${i+1}">${names[i]}</span><span><b>${esc(x.t.market)}</b><small>${esc(x.m.home.name)} – ${esc(x.m.away.name)} · ${dayShort(x.m.date)} ${x.m.time}</small></span><span class="ev">${x.t.odds?x.t.odds.toFixed(2):""}<small>EV ${x.t.ev!=null?evTxt(x.t.ev):"—"} · ${x.t.rating}/10</small></span></button>`).join("")
    :`<div class="empty"><b style="color:var(--fg)">BRAK WARTOŚCIOWEGO TYPU — NO BET.</b><br>Żaden mecz ${isBB()?"tego dnia":"tej kolejki"} nie daje wystarczającej przewagi.</div>`;
  return `<section class="panel"><div class="day"><h2>${isBB()?"Typy dnia":"Typy kolejki"}</h2>${DATA?"":"<small>dane przykładowe</small>"}</div><div class="card">${body}</div>${RESP}</section>`;
}

V.szanse=function(){
  const lm=lambdas();
  if(!lm){const t=tipOf(M);return `<div class="panel" style="display:flex;flex-direction:column;gap:18px">${t?`<section><h2>Analiza typu</h2>${tipCard(t,M)}</section>`:""}<div class="card empty">Brak tabeli ligowej, więc model nie policzy szans.<br>Tabela pojawi się przy najbliższej porannej aktualizacji.</div>${infoSection(M)}${t?RESP:""}</div>`;}
  if(M.status.pst) return empty("Mecz przełożony. Szanse policzę, gdy pojawi się nowy termin.");
  const pre=grid(lm.lh,lm.la), k=M.status.kind, sc=scoreOf(M), T=leagueTable();
  const pos=t=>T.indexOf(t)+1, perG=(a,b)=>b?(a/b).toFixed(2).replace(".",","):"—";
  let html="";
  if(k==="live"){const now=liveGrid(lm);
    html+=probCard(now,`Teraz · ${M.status.min} przy ${sc[0]}:${sc[1]}`,`Uwzględnia aktualny wynik, pozostały czas${M.events.some(e=>e.t==="rc")?" i czerwone kartki":""}.`);
    html+=probCard(pre,"Przed meczem","");
    const t=topScores(now,4);html+=`<section><h2>Najbardziej prawdopodobny wynik końcowy</h2><div class="tiles">${t.slice(0,3).map(([a,b,v])=>tile(`${a}:${b}`,pc(v))).join("")}</div></section>`;
  } else {
    html+=probCard(pre,k==="ft"?"Szanse przed meczem":"Szanse na wynik",k==="ft"?(()=>{const p=sc[0]>sc[1]?pre.pH:sc[0]<sc[1]?pre.pA:pre.pD;return `Wynik ${sc[0]}:${sc[1]} miał przed meczem ${pc(p)} szans${p<0.25?" — to była niespodzianka.":"."}`})():"");
  }
  const g=k==="live"?liveGrid(lm):pre;
  html+=`<section><h2>Oczekiwane gole (model)</h2><div class="tiles">${tile(esc(M.home.short),lm.lh.toFixed(2).replace(".",","))}${tile("Razem",(lm.lh+lm.la).toFixed(2).replace(".",","))}${tile(esc(M.away.short),lm.la.toFixed(2).replace(".",","))}</div></section>
  <section><h2>${k==="live"?"Rynki do końca meczu":"Inne zdarzenia"}</h2><div class="tiles">${tile("Ponad 2,5 gola",pc(g.o25))}${tile("Obie strzelą",pc(g.btts))}${tile("Czyste konto "+esc(M.home.short),pc(g.g.reduce((s,row)=>s+(g.base[1]===0?row[0]:0),0)/(g.pH+g.pD+g.pA)))}</div></section>
  <section><h2>Dokładny wynik${k==="live"?" (końcowy)":""}</h2>${heatmap(g,k==="ft"?sc:null)}</section>
  <section><h2>Forma i tabela</h2><div class="card">
    <div class="vs"><b>${pos(lm.h)}.</b><span>Miejsce w tabeli</span><b>${pos(lm.a)}.</b></div>
    <div class="vs"><b>${dash(lm.h.pts)}</b><span>Punkty (${lm.h.p} / ${lm.a.p} m.)</span><b>${dash(lm.a.pts)}</b></div>
    <div class="vs"><b>${perG(lm.h.gf,lm.h.p)}</b><span>Gole strzelone / mecz</span><b>${perG(lm.a.gf,lm.a.p)}</b></div>
    <div class="vs"><b>${perG(lm.h.ga,lm.h.p)}</b><span>Gole stracone / mecz</span><b>${perG(lm.a.ga,lm.a.p)}</b></div>
    <div class="vs">${formHtml(lm.h.form)}<span>Ostatnie 5</span>${formHtml(lm.a.form)}</div>
  </div></section>
  ${(()=>{const t=tipOf(M),hdr=M.status.kind==="ns"?"Analiza typu":"Analiza typu (sprzed meczu)";return t?`<section><h2>${hdr}${t.auto?" · wycena modelu":""}</h2>${tipCard(t,M)}</section>`:(M.status.kind==="ns"?`<section><h2>Analiza typu</h2><div class="card empty">Analiza pojawi się przy porannej aktualizacji${oddsOf(M)?"":", gdy będą dostępne kursy"}.</div></section>`:"")})()}
  <section><h2>Kursy i wartość (EV)</h2>${oddsTable(M,pre)}</section>
  ${infoSection(M)}
  ${RESP}
  <p class="method">Jak to liczę: siła ataku i obrony każdej drużyny z bramek w tabeli (wygładzona w stronę średniej ligowej), przewaga własnego boiska, a potem rozkład Poissona dla liczby goli. To szacunek statystyczny, nie pewnik.</p>`;
  return `<div class="panel" style="display:flex;flex-direction:column;gap:18px">${html}</div>`;
};

/* ---------- Koszykówka ---------- */
const VB={
  mecz(){
    const ns=M.status.kind==="ns", q=M.quarters, a=M.arena||{};
    let h=`<section class="panel"><h2>Status</h2><div class="tiles">${tile("Status",esc(M.status.code))}${tile(ns?"Początek":"Czas",esc(ns?M.time:M.status.min))}${tile("Widzowie",M.attendance?M.attendance.toLocaleString("pl-PL"):"—")}</div></section>`;
    if(q&&q.home&&q.home.length){
      const n=Math.max(q.home.length,q.away.length), lab=i=>i<4?(i+1)+". kw.":(i===4?"OT":"OT"+(i-3));
      const row=(t,arr,tot)=>`<tr><td>${esc(t.name)}</td>${Array.from({length:n},(_,i)=>`<td>${dash(arr[i])}</td>`).join("")}<td><b>${dash(tot)}</b></td></tr>`;
      h+=`<section><h2>Kwarty</h2><div class="card tableScroll"><table class="odds"><thead><tr><th>Drużyna</th>${Array.from({length:n},(_,i)=>`<th>${lab(i)}</th>`).join("")}<th>Razem</th></tr></thead><tbody>${row(M.home,q.home,M.score&&M.score[0])}${row(M.away,q.away,M.score&&M.score[1])}</tbody></table></div></section>`;
    }
    const lowerBetter=["Straty","Faule"];
    const rows=M.teamStats.filter(r=>typeof r[1]==="number"&&typeof r[2]==="number").map(([l,x,y])=>{const t=x+y||1,lb=lowerBetter.includes(l),aw=lb?x<y:x>y,bw=lb?y<x:y>x;
      return `<div class="cmp"><div class="row"><b class="${aw?"lead":""}">${fmt(x)}</b><span>${esc(l)}</span><b class="${bw?"lead":""}">${fmt(y)}</b></div><div class="bar"><i style="flex:${x/t||.5}"></i><i style="flex:${y/t||.5}"></i></div></div>`}).join("");
    if(rows) h+=`<section><h2>Statystyki drużynowe</h2><div class="card"><div class="cmp"><div class="row" style="margin:0"><b style="color:var(--home)">${esc(M.home.short)}</b><span></span><b style="color:var(--away)">${esc(M.away.short)}</b></div></div>${rows}</div></section>`;
    const lead=s=>{const P=M.players[s]; if(!P.length) return null; const top=k=>{const b=P.filter(p=>p[k]!=null).sort((x,y)=>y[k]-x[k])[0]; return b?`${esc(b.n)} <span class="num">${b[k]}</span>`:"—"}; return [top("pts"),top("reb"),top("ast")];};
    const lh=lead("home"), la=lead("away");
    if(lh||la) h+=`<section><h2>Liderzy</h2>${kv([["Punkty "+M.home.short,lh?lh[0]:"—"],["Punkty "+M.away.short,la?la[0]:"—"],["Zbiórki "+M.home.short,lh?lh[1]:"—"],["Zbiórki "+M.away.short,la?la[1]:"—"],["Asysty "+M.home.short,lh?lh[2]:"—"],["Asysty "+M.away.short,la?la[2]:"—"]])}</section>`;
    h+=`<section><h2>Spotkanie</h2>${kv([["Rozgrywki","NBA"],["Sezon",DATA?esc(DATA.season||"—"):"—"],["Data",dayLabel(M.date)],["Godzina (czas polski)",M.time],["Hala",esc(dash(a.name||M.home.arena))],["Miasto",esc(dash(a.city||M.home.city))],["Gospodarze",`${esc(M.home.name)} <span class="pos">${M.home.id}</span>`],["Goście",`${esc(M.away.name)} <span class="pos">${M.away.id}</span>`]].concat(M.officials.length?[["Sędziowie",M.officials.map(esc).join(", ")]]:[]))}</section>`;
    if(M.notes) h+=`<section><h2>Uwagi</h2><div class="card empty" style="text-align:left">${esc(M.notes)}</div></section>`;
    return h;
  },
  box(){
    const P=M.players[state.side==="a"?"away":"home"];
    let h=`<section class="panel">${seg(M.home.name,M.away.name)}</section>`;
    if(!P.length) return h+empty(M.status.kind==="ns"?"Statystyki zawodników pojawią się po meczu.":"Brak statystyk zawodników dla tego meczu.");
    const C=[["min","MIN"],["pts","PKT"],["reb","ZB"],["ast","AS"],["stl","PRZ"],["blk","BL"],["tov","STR"],["fg","Z GRY"],["tp","ZA 3"],["ft","WOLNE"],["pm","+/-"]];
    const r=p=>`<tr><td>${esc(p.n)}${p.pos?` <span class="pos">${esc(p.pos)}</span>`:""}</td>${C.map(([k])=>`<td>${k==="pts"?`<b>${dash(p[k])}</b>`:dash(p[k])}</td>`).join("")}</tr>`;
    const st=P.filter(p=>p.start), bn=P.filter(p=>!p.start);
    const tb=(t,L)=>L.length?`<section><h2>${t}</h2><div class="card tableScroll"><table class="odds"><thead><tr><th>Zawodnik</th>${C.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${L.map(r).join("")}</tbody></table></div></section>`:"";
    return h+tb("Pierwsza piątka",st)+tb(st.length?"Rezerwowi":"Zawodnicy",bn);
  },
  tabela(){
    const S=(DATA&&DATA.standings)||{}, mine=[M.home.id,M.away.id];
    const conf=(k,t)=>{const L=S[k]||[]; if(!L.length) return "";
      return `<section><h2>${t}</h2><div class="card tableScroll"><table class="odds"><thead><tr><th>#</th><th>Drużyna</th><th>W</th><th>P</th><th>%</th><th>Str.</th><th>Dom</th><th>Wyj.</th><th>Ost. 10</th><th>Seria</th></tr></thead><tbody>${L.map((r,i)=>{const T=TEAMS[r.team]||{name:r.team},pct=r.w+r.l?(r.w/(r.w+r.l)).toFixed(3).replace(/^0/,""):"—";
        return `<tr class="${mine.includes(r.team)?"val":""}"><td>${i+1}</td><td>${esc(T.name)}</td><td>${r.w}</td><td>${r.l}</td><td>${pct}</td><td>${dash(r.gb)}</td><td>${dash(r.home)}</td><td>${dash(r.away)}</td><td>${dash(r.l10)}</td><td>${dash(r.strk)}</td></tr>`}).join("")}</tbody></table></div></section>`;};
    const h=conf("E","Konferencja Wschodnia")+conf("W","Konferencja Zachodnia");
    return h?`<div class="panel" style="display:flex;flex-direction:column;gap:18px">${h}</div>`:empty("Brak tabeli. Pojawi się przy najbliższej porannej aktualizacji.");
  },
  szanse(){
    const t=M.tip, o=M.odds;
    let h=`<div class="panel" style="display:flex;flex-direction:column;gap:18px">`;
    h+=t?`<section><h2>Analiza typu</h2>${tipCard(t,M)}</section>`:`<div class="card empty">Brak analizy dla tego meczu.</div>`;
    if(o){const f=v=>v!=null?Number(v).toFixed(2).replace(".",","):"—", sg=v=>v==null?"":(v>0?"+":"")+String(v).replace(".",",");
      const rows=[];
      if(o.ml1!=null||o.ml2!=null) rows.push(["Zwycięzca (z dogrywką) – "+M.home.short,f(o.ml1)],["Zwycięzca (z dogrywką) – "+M.away.short,f(o.ml2)]);
      if(o.spread!=null) rows.push([`Handicap ${M.home.short} ${sg(o.spread)}`,f(o.sp1)],[`Handicap ${M.away.short} ${sg(-o.spread)}`,f(o.sp2)]);
      if(o.total!=null) rows.push([`Powyżej ${String(o.total).replace(".",",")} pkt`,f(o.over)],[`Poniżej ${String(o.total).replace(".",",")} pkt`,f(o.under)]);
      if(rows.length) h+=`<section><h2>Kursy</h2>${kv(rows.map(([k,v])=>[esc(k),`<span class="num">${v}</span>`]))}${o.src?`<p class="resp" style="text-align:left">${esc(o.src)}</p>`:""}</section>`;}
    const i=M.info;
    if(i&&i.b2b) h+=`<section><h2>Mecz dzień po dniu (back-to-back)</h2>${kv([[esc(M.home.short),i.b2b.home?"tak":"nie"],[esc(M.away.short),i.b2b.away?"tak":"nie"]])}</section>`;
    return h+infoSection(M)+(t?RESP:"")+`</div>`;
  }
};
function renderMatch(){
  renderBoard(); buildTabs(!!M.bb);
  const VV=M.bb?VB:V; if(!VV[state.tab]) state.tab="mecz";
  $("#view").innerHTML=VV[state.tab]();
  $("#nav").hidden=false;
  document.querySelectorAll("nav button[data-t]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===state.tab));
}
function renderSide(){
  $("#side").innerHTML=`<h3>Meczownik</h3>`+SPORTS.map(sp=>{const open=state.fold[sp.id]!==false;
    return `<button class="folder" data-fold="${sp.id}" aria-expanded="${open}" aria-controls="lg-${sp.id}"><svg class="ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${sp.icon}</svg>${sp.name}<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lglist" id="lg-${sp.id}" role="group" aria-label="${sp.name} – wybór ligi" ${open?"":"hidden"}>${sp.leagues.map(c=>LEAGUES.find(l=>l[0]===c)).map(([c,n,k])=>`<button class="lg" data-league="${c}" aria-pressed="${state.league===c}">${n}<small>${k}</small></button>`).join("")}</div>`}).join("");
}
function setSide(o){ $("#side").classList.toggle("open",o); $("#scrim").hidden=!o; }
function render(){ state.view==="home"?renderHome():renderMatch(); renderSide(); save(); }

function openMatch(id,push=true){
  const fx=allFx().find(f=>f.id===id); if(!fx) return;
  M=getMatch(fx); G=goalsOf(M); state.view="match"; state.mid=id; state.tab="mecz"; state.side="h"; state.player=null;
  if(push) try{history.pushState({mid:id},"")}catch(e){}
  $("#main").scrollTop=0; render();
}
function goHome(){ state.view="home"; $("#main").scrollTop=0; render(); }

/* ---------- Zdarzenia ---------- */
$("#head").addEventListener("click",e=>{
  if(e.target.closest("#back")){ try{ if(history.state&&history.state.mid){history.back();return} }catch(_){} goHome(); return; }
  const rs=Object.keys(FIXTURES).map(Number).sort((a,b)=>a-b), i=rs.indexOf(state.round);
  if(e.target.closest("#rprev")&&i>0){state.round=rs[i-1];render()}
  if(e.target.closest("#rnext")&&i<rs.length-1){state.round=rs[i+1];render()}
  if(e.target.closest("#menu")) setSide(true);
});
$("#side").addEventListener("click",e=>{
  const fo=e.target.closest("[data-fold]"); if(fo){ const k=fo.dataset.fold; state.fold={...state.fold,[k]:state.fold[k]===false}; renderSide(); save(); return; }
  const lg=e.target.closest("[data-league]"); if(!lg) return;
  setSide(false);
  if(state.view!=="home"){ state.view="home"; try{ if(history.state&&history.state.mid) history.replaceState(null,"") }catch(_){} }
  if(lg.dataset.league!==state.league) activate(lg.dataset.league); else render();
  $("#main").scrollTop=0;
});
$("#scrim").addEventListener("click",()=>setSide(false));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") setSide(false); });
window.addEventListener("popstate",()=>{ if(state.view==="match") goHome(); });
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.home){$("#back").click();return}state.tab=b.dataset.t;$("#main").scrollTop=0;render()});
$("#view").addEventListener("click",e=>{
  const tp=e.target.closest("[data-tip]"); if(tp){openMatch(tp.dataset.tip);state.tab="szanse";render();return}
  const m=e.target.closest("[data-mid]"); if(m){openMatch(m.dataset.mid);return}
  const f=e.target.closest("[data-filter]"); if(f){state.filter=f.dataset.filter;render();return}
  const s=e.target.closest("[data-side]"); if(s){state.side=s.dataset.side;render();return}
  const p=e.target.closest("[data-player]"); if(p){state.player=p.dataset.player;state.tab="gracz";$("#main").scrollTop=0;render()}
});
$("#view").addEventListener("change",e=>{if(e.target.id==="psel"){state.player=e.target.value;render()}});
TODAY=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Warsaw"});
activate(state.league);
